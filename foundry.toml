[profile.default]
solc = "0.8.28"
src = "src"
out = "out"
libs = ["lib"]
# InvariantTestVulnerable is an intentional proof-of-vulnerability demonstrating automated failure detection
# Normal CI and passing test runs exclude it; run `FOUNDRY_PROFILE=exploit forge test` or `forge test --match-contract InvariantTestVulnerable` to execute it
no_match_contract = "InvariantTestVulnerable"

[profile.exploit]
solc = "0.8.28"
src = "src"
out = "out"
libs = ["lib"]
no_match_contract = ""
match_contract = "InvariantTestVulnerable"

[invariant]
runs = 1000
depth = 50